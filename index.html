<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Jogo 2048</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="title-container">
        <h1>2048</h1>
        <p class="subtitle">Junte os blocos para alcançar o número <strong>2048</strong>!</p>
      </div>
      <div class="scores-container">
        <div class="score-box">
          <span class="label">PONTOS</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="score-box">
          <span class="label">MELHOR</span>
          <span id="best-score" class="value">0</span>
        </div>
      </div>
    </header>

    <div class="controls-bar">
      <button id="restart-btn" class="btn">Novo Jogo</button>
      <div class="instructions">
        <span>Use as <strong>setas do teclado</strong> ou deslize (<strong>swipe</strong>) na tela</span>
      </div>
    </div>

    <div class="game-wrapper">
      <div id="game-board" class="grid-container">
        <!-- 16 células de fundo geradas estaticamente -->
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>

        <!-- Peças dinâmicas -->
        <div id="tile-container" class="tile-container"></div>

        <!-- Overlays de Fim de Jogo / Vitória -->
        <div id="game-over-overlay" class="overlay hidden">
          <p class="overlay-msg">Fim de Jogo!</p>
          <button id="retry-btn" class="btn">Tentar Novamente</button>
        </div>
        <div id="win-overlay" class="overlay hidden">
          <p class="overlay-msg">Você Venceu!</p>
          <div class="overlay-actions">
            <button id="keep-going-btn" class="btn">Continuar Jogando</button>
            <button id="win-restart-btn" class="btn">Reiniciar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Controles móveis virtuais para conveniência extra além do swipe -->
    <div class="mobile-controls">
      <div class="d-pad">
        <button class="d-btn up" data-dir="ArrowUp" aria-label="Cima">▲</button>
        <div class="d-pad-row">
          <button class="d-btn left" data-dir="ArrowLeft" aria-label="Esquerda">◀</button>
          <button class="d-btn down" data-dir="ArrowDown" aria-label="Baixo">▼</button>
          <button class="d-btn right" data-dir="ArrowRight" aria-label="Direita">▶</button>
        </div>
      </div>
    </div>

    <footer class="footer">
      <p>Desenvolvido com HTML, CSS e JavaScript puro.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
